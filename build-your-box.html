<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build Your Box — Stock'd Haus</title>
<meta name="description" content="Mix any cuts from across the Stock'd Up brands into one box. The more you add, the more you save.">
<meta name="theme-color" content="#100E0D">
<link rel="icon" type="image/png" sizes="32x32" href="images/brand/favicon-32.png">
<link rel="apple-touch-icon" href="images/brand/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&amp;family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&amp;family=Jost:wght@300;400;500;600&amp;display=swap">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/store.css">
<script>document.documentElement.classList.add('js')</script>
</head>
<body data-page="box">

<main class="page-top section" style="padding-bottom: clamp(72px, 9vw, 120px)">
<div class="wrap">
<div class="section-head" style="margin-bottom: 36px">
<p class="eyebrow">Build your box</p>
<h1 class="h2" style="margin: 0">Your cuts. Your box.</h1>
<p class="lede" id="box-intro" style="margin-top: 18px"></p>
</div>
<div class="filters" id="tabs" style="position: static; display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 28px"></div>
<div class="box-layout">
<div class="box-grid" id="box-grid"></div>
<aside class="box-panel" aria-labelledby="box-title">
<h2 id="box-title">Your box</h2>
<p class="fine" id="box-hint" style="margin: 0"></p>
<div class="box-steps" id="box-steps"></div>
<ul class="box-items" id="box-items"></ul>
<div class="box-sum">
<div><span>Items</span><span id="sum-items">$0</span></div>
<div class="save"><span id="sum-save-label">Box saving</span><span id="sum-save">$0</span></div>
<div class="total"><span>Box total</span><b id="sum-total">$0</b></div>
</div>
<button class="btn btn--block" type="button" id="box-add" disabled>Add box to cart</button>
</aside>
</div>
</div>
</main>

<script src="assets/js/catalog.js"></script>
<script src="assets/js/store.js"></script>
<script>
(function () {
  var S = window.SH, tiers = S.settings.boxTiers, min = tiers[0].items;
  var items = S.products.filter(function (p) { return ['boxes', 'gifts'].indexOf(p.category) < 0; });
  var tab = '', box = [];

  document.getElementById('box-intro').textContent = 'Mix any steaks, burgers and seafood from across our brands. Save ' +
    tiers.map(function (t) { return t.percent + '% at ' + t.items; }).join(', ') + ' items. [confirm]';
  document.getElementById('box-steps').innerHTML = tiers.map(function (t) {
    return '<div class="box-step" data-at="' + t.items + '"><b>' + t.percent + '%</b>' + t.items + '+ items</div>';
  }).join('');

  function drawTabs() {
    var brandsHere = S.brands.filter(function (b) { return items.some(function (p) { return p.brand === b.id; }); });
    document.getElementById('tabs').innerHTML = [{ id: '', name: 'All' }].concat(brandsHere).map(function (b) {
      return '<button type="button" class="chip-btn" style="width: auto; border-color: var(--line-3)" data-tab="' + b.id + '" aria-pressed="' + (tab === b.id) + '">' + S.esc(b.name) + '</button>';
    }).join('');
  }
  function drawGrid() {
    var grid = document.getElementById('box-grid');
    grid.innerHTML = items.filter(function (p) { return !tab || p.brand === tab; }).map(function (p) {
      var sel = p.variants ? '<label class="visually-hidden" for="v-' + p.id + '">Option for ' + S.esc(p.name) + '</label><select class="select" id="v-' + p.id + '" style="min-height: 40px; width: 100%; margin-top: 10px">' +
        p.variants.map(function (v, i) { return '<option value="' + i + '">' + S.esc(v.label) + ' · ' + S.money(v.price) + '</option>'; }).join('') + '</select>' : '';
      return '<article class="card" data-reveal>' +
        '<a class="card-media" href="product.html?id=' + p.id + '">' + S.media(p) + '</a>' +
        '<div class="card-body"><p class="card-brand">' + S.esc(S.brandName(p.brand)) + (p.tier ? ' · ' + p.tier : '') + '</p>' +
        '<h3 class="card-name">' + S.esc(p.name) + '</h3><p class="card-size">' + S.esc(p.size || '') + '</p>' + sel +
        '<div class="card-foot"><p class="card-price">' + (p.variants ? 'From ' : '') + S.money(S.fromPrice(p)) + '</p>' +
        '<button class="card-add" type="button" data-box="' + p.id + '">Add to box</button></div></div></article>';
    }).join('');
    S.reveal(grid);
  }
  function percentFor(n) {
    var pct = 0; tiers.forEach(function (t) { if (n >= t.items) pct = t.percent; }); return pct;
  }
  function drawBox() {
    var n = box.reduce(function (t, b) { return t + b.qty; }, 0);
    var sub = box.reduce(function (t, b) { return t + b.price * b.qty; }, 0);
    var pct = percentFor(n), save = Math.round(sub * pct / 100);
    document.getElementById('box-items').innerHTML = box.length ? box.map(function (b, i) {
      return '<li><span>' + S.esc(b.name) + '<small>' + S.esc(S.brandName(b.brand) + (b.variant ? ' · ' + b.variant : '')) + '</small></span>' +
        '<div class="qty qty--sm"><button type="button" data-bdec="' + i + '" aria-label="Remove one">−</button><span>' + b.qty + '</span><button type="button" data-binc="' + i + '" aria-label="Add one">+</button></div></li>';
    }).join('') : '<li style="display: block; color: var(--text-3)">Add at least ' + min + ' items to build a box.</li>';
    var next = tiers.find(function (t) { return n < t.items; });
    document.getElementById('box-hint').textContent = next ? 'Add ' + (next.items - n) + ' more to save ' + next.percent + '%.' : 'You\'re saving the most a box can.';
    document.querySelectorAll('.box-step').forEach(function (s) { s.classList.toggle('is-on', n >= +s.dataset.at); });
    document.getElementById('sum-items').textContent = S.money(sub);
    document.getElementById('sum-save-label').textContent = 'Box saving' + (pct ? ' (' + pct + '%)' : '');
    document.getElementById('sum-save').textContent = '−' + S.money(save);
    document.getElementById('sum-total').textContent = S.money(sub - save);
    var add = document.getElementById('box-add');
    add.disabled = n < min;
    add.textContent = n < min ? 'Add ' + (min - n) + ' more to continue' : 'Add box to cart · ' + S.money(sub - save);
  }
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-tab]');
    if (t) { tab = t.dataset.tab; drawTabs(); drawGrid(); return; }
    var a = e.target.closest('[data-box]');
    if (a) {
      var p = S.product(a.dataset.box), sel = document.getElementById('v-' + p.id);
      var v = p.variants ? p.variants[sel ? +sel.value : 0] : null;
      var key = p.id + '|' + (v ? v.label : '');
      var found = box.find(function (b) { return b.key === key; });
      if (found) found.qty++;
      else box.push({ key: key, id: p.id, name: p.name, brand: p.brand, variant: v ? v.label : '', price: v ? v.price : p.price, qty: 1 });
      S.toast(p.name + ' added to your box');
      drawBox(); return;
    }
    var inc = e.target.closest('[data-binc]'), dec = e.target.closest('[data-bdec]');
    if (inc) { box[+inc.dataset.binc].qty++; drawBox(); }
    if (dec) { var i = +dec.dataset.bdec; box[i].qty--; if (box[i].qty < 1) box.splice(i, 1); drawBox(); }
  });
  document.getElementById('box-add').addEventListener('click', function () {
    var n = box.reduce(function (t, b) { return t + b.qty; }, 0);
    var sub = box.reduce(function (t, b) { return t + b.price * b.qty; }, 0);
    var total = sub - Math.round(sub * percentFor(n) / 100);
    S.addToCart({ id: 'custom-box', name: 'Build Your Box (' + n + ' items)', brand: 'stockd-haus', image: 'images/real-sliced.webp', price: total,
      box: box.map(function (b) { return { name: b.name + (b.variant ? ' (' + b.variant + ')' : ''), qty: b.qty }; }) });
    box = []; drawBox();
  });
  drawTabs(); drawGrid(); drawBox();
})();
</script>
</body>
</html>
