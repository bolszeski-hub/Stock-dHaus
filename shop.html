<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop All — Stock'd Haus</title>
<meta name="description" content="Shop wagyu, beef, pork, poultry and seafood from the Stock'd Up family of brands.">
<meta name="theme-color" content="#100E0D">
<link rel="icon" type="image/png" sizes="32x32" href="images/brand/favicon-32.png">
<link rel="apple-touch-icon" href="images/brand/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&amp;family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&amp;family=Jost:wght@300;400;500;600&amp;display=swap">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/store.css">
<script>document.documentElement.classList.add('js')</script>
</head>
<body data-page="shop">

<main class="page-top section" style="padding-bottom: clamp(72px, 9vw, 120px)">
<div class="wrap">
<div class="shop-head">
<div>
<p class="eyebrow" id="shop-eyebrow">Shop</p>
<h1 class="h2" id="shop-title" style="margin: 0">Shop all</h1>
<p class="muted" id="shop-line" style="margin: 14px 0 0; max-width: 640px"></p>
</div>
<div class="toolbar">
<label class="visually-hidden" for="q">Search products</label>
<input class="search-box" id="q" type="search" placeholder="Search products">
<label class="visually-hidden" for="sort">Sort by</label>
<select class="select" id="sort">
<option value="featured">Featured</option>
<option value="price-asc">Price, low to high</option>
<option value="price-desc">Price, high to low</option>
<option value="name">Name, A to Z</option>
</select>
</div>
</div>

<div class="brand-banner" id="brand-banner" hidden></div>
<div class="shop-layout">
<div class="filters" id="filters"></div>
<div>
<p class="result-count" id="count"></p>
<div class="grid" id="grid"></div>
</div>
</div>
</div>
</main>

<script src="assets/js/catalog.js"></script>
<script src="assets/js/store.js"></script>
<script>
(function () {
  var S = window.SH;
  var state = { brand: S.param('brand') || '', category: S.param('category') || '', q: (S.param('q') || '').toLowerCase(), sort: 'featured' };
  var filters = document.getElementById('filters');

  function counts(key, val) {
    return S.products.filter(function (p) {
      return (key === 'brand' ? p.brand === val : p.category === val);
    }).length;
  }
  function chip(group, val, label, n) {
    return '<button type="button" class="chip-btn" data-group="' + group + '" data-val="' + val + '" aria-pressed="' + (state[group] === val) + '">' +
      S.esc(label) + (n != null ? '<small>' + n + '</small>' : '') + '</button>';
  }
  function drawFilters() {
    filters.innerHTML =
      '<fieldset><legend>Brand</legend>' + chip('brand', '', 'All brands') +
      S.brands.map(function (b) { return chip('brand', b.id, b.name, counts('brand', b.id)); }).join('') + '</fieldset>' +
      '<fieldset><legend>Category</legend>' + chip('category', '', 'All categories') +
      S.categories.map(function (c) { return chip('category', c.id, c.name, counts('category', c.id)); }).join('') + '</fieldset>';
  }
  filters.addEventListener('click', function (e) {
    var b = e.target.closest('[data-group]'); if (!b) return;
    state[b.dataset.group] = b.dataset.val;
    var url = new URL(location.href);
    ['brand', 'category'].forEach(function (k) { if (state[k]) url.searchParams.set(k, state[k]); else url.searchParams.delete(k); });
    url.searchParams.delete('focus');
    history.replaceState(null, '', url);
    draw();
  });
  document.getElementById('q').addEventListener('input', function (e) { state.q = e.target.value.trim().toLowerCase(); draw(); });
  document.getElementById('sort').addEventListener('change', function (e) { state.sort = e.target.value; draw(); });

  function draw() {
    drawFilters();
    var brand = S.brands.find(function (b) { return b.id === state.brand; });
    var cat = S.categories.find(function (c) { return c.id === state.category; });
    document.getElementById('shop-title').textContent = brand ? brand.name : cat ? cat.name : 'Shop all';
    document.getElementById('shop-eyebrow').textContent = brand ? 'Brand' : cat ? 'Category' : 'Shop';
    document.getElementById('shop-line').textContent = brand ? brand.line : 'Wagyu, beef, pork, poultry and seafood from the Stock\'d Up family of brands.';
    document.title = (brand ? brand.name : cat ? cat.name : 'Shop All') + ' — Stock\'d Haus';
    var banner = document.getElementById('brand-banner');
    banner.hidden = !brand;
    if (brand) banner.innerHTML = (brand.image ? '<img class="bb-bg" src="' + brand.image + '" alt="">' : '') +
      '<div class="bb-body">' + (brand.mark ? '<img class="bb-mark" src="' + brand.mark + '" alt="">' : '') +
      '<div>' + (brand.usExclusive ? '<p class="bb-excl">' + S.esc(S.exclusiveNote(brand.name)) + '</p>' : '') +
      '<p class="bb-story">' + S.esc(brand.story || '[A short story about ' + brand.name + ': where it comes from, what makes it different, and who it suits.]') + '</p></div>' +
      (brand.site ? '<a class="text-link" href="' + brand.site + '" target="_blank" rel="noopener">Visit ' + S.esc(brand.name) + ' →</a>' : '') + '</div>';
    var list = S.products.filter(function (p) {
      if (state.brand && p.brand !== state.brand) return false;
      if (state.category && p.category !== state.category) return false;
      if (state.q && (p.name + ' ' + S.brandName(p.brand) + ' ' + (p.tier || '')).toLowerCase().indexOf(state.q) < 0) return false;
      return true;
    });
    var by = {
      'price-asc': function (a, b) { return S.fromPrice(a) - S.fromPrice(b); },
      'price-desc': function (a, b) { return S.fromPrice(b) - S.fromPrice(a); },
      name: function (a, b) { return a.name.localeCompare(b.name); },
      featured: function (a, b) { return (a.featured || 99) - (b.featured || 99); }
    }[state.sort];
    list.sort(by);
    document.getElementById('count').textContent = list.length + (list.length === 1 ? ' product' : ' products');
    var grid = document.getElementById('grid');
    grid.innerHTML = list.length ? list.map(S.card).join('') :
      '<div class="no-results" style="grid-column: 1 / -1"><p>Nothing matches yet. Try another brand or category.</p></div>';
    S.reveal(grid);
  }
  draw();
  if (state.q) document.getElementById('q').value = S.param('q');
})();
</script>
</body>
</html>
