<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journal — Stock'd Haus</title>
<meta name="description" content="Guides for the home cook from Stock'd Haus.">
<meta name="theme-color" content="#100E0D">
<link rel="icon" type="image/png" sizes="32x32" href="images/brand/favicon-32.png">
<link rel="apple-touch-icon" href="images/brand/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&amp;family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&amp;family=Jost:wght@300;400;500;600&amp;display=swap">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/store.css">
<script>document.documentElement.classList.add('js')</script>
</head>
<body data-page="journal">

<main class="page-top section" style="padding-bottom: clamp(56px, 7vw, 96px)">
<article class="wrap wrap--narrow article" id="article"></article>
</main>
<section class="section section--alt" aria-labelledby="art-shop" style="padding-block: clamp(64px, 8vw, 104px)">
<div class="wrap">
<div class="shop-head"><div><p class="eyebrow">Shop the guide</p><h2 id="art-shop" class="h2">Put it into practice</h2></div><a class="text-link" href="journal.html">More guides →</a></div>
<div class="rail" id="art-products"></div>
</div>
</section>

<script src="assets/js/catalog.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/journal.js"></script>
<script>
(function () {
  var S = SH, a = S.article(S.param('id')) || S.articles[0];
  document.title = a.title + ' — Stock\'d Haus';
  var html = a.body.map(function (b) {
    if (b[0] === 'list') return '<ul>' + b[1].map(function (i) { return '<li>' + S.esc(i) + '</li>'; }).join('') + '</ul>';
    if (b[0] === 'tip') return '<aside class="tip"><p>' + S.esc(b[1]) + '</p></aside>';
    return '<' + b[0] + '>' + S.esc(b[1]) + '</' + b[0] + '>';
  }).join('');
  document.getElementById('article').innerHTML =
    '<p class="crumbs"><a href="journal.html">Journal</a> / ' + S.esc(a.kicker) + '</p>' +
    '<h1 class="display display--md">' + S.esc(a.title) + '</h1>' +
    '<p class="fine" style="margin: 18px 0 32px">' + a.minutes + ' min read</p>' +
    '<div class="article-img"><img src="' + a.image + '" alt=""></div>' +
    '<div class="article-body">' + html + '</div>';
  document.getElementById('art-products').innerHTML = a.shop.map(function (id) { return S.card(S.product(id)); }).join('');
  S.reveal();
})();
</script>
</body>
</html>
